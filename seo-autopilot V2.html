<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:rgba(0,255,136,0.2) transparent}
*::-webkit-scrollbar{width:4px}*::-webkit-scrollbar-thumb{background:rgba(0,255,136,0.2);border-radius:2px}
body{background:#060a10;font-family:'Courier New',monospace;color:#e0e8f0;min-height:100vh}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
.pulse{animation:pulse 2s infinite}.blink{animation:blink 1s infinite}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,255,136,0.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,255,136,0.025) 1px,transparent 1px);
  background-size:44px 44px}
.scan-line{position:fixed;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,136,0.2),transparent);
  animation:scan 8s linear infinite;z-index:0;pointer-events:none}
input,textarea,select{font-family:'Courier New',monospace}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scan-line"></div>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

// ── CONFIG ──────────────────────────────────────────────────────
const API_BASE     = "https://api.tikprofitpro.shop";
const GENERATE_URL = `${API_BASE}/generate-blog-post`;
const PUBLISH_URL  = `${API_BASE}/publish-blog-post`;
const BLOG_URL     = "https://blog.tikprofitpro.shop";
const BRAND        = "TikProfitPro";
const DOMAIN       = "tikprofitpro.shop";

// ── COMPETITOR KEYWORDS ─────────────────────────────────────────
const COMPETITOR_KEYWORDS = [
  // Fastmoss keywords
  {kw:"fastmoss alternative",         comp:"Fastmoss",  vol:"1,400", difficulty:"Low",    intent:"Money"},
  {kw:"fastmoss vs kalodata",         comp:"Fastmoss",  vol:"880",   difficulty:"Low",    intent:"Money"},
  {kw:"tiktok shop analytics tool",   comp:"Fastmoss",  vol:"3,200", difficulty:"Medium", intent:"Money"},
  {kw:"tiktok shop spy tool",         comp:"Fastmoss",  vol:"2,100", difficulty:"Low",    intent:"Money"},
  {kw:"tiktok shop sales data",       comp:"Fastmoss",  vol:"4,500", difficulty:"Medium", intent:"Info"},
  // Kalodata keywords
  {kw:"kalodata alternative",         comp:"Kalodata",  vol:"1,200", difficulty:"Low",    intent:"Money"},
  {kw:"kalodata free alternative",    comp:"Kalodata",  vol:"760",   difficulty:"Low",    intent:"Money"},
  {kw:"tiktok shop product tracker",  comp:"Kalodata",  vol:"2,800", difficulty:"Medium", intent:"Money"},
  {kw:"tiktok shop revenue tracker",  comp:"Kalodata",  vol:"1,900", difficulty:"Low",    intent:"Info"},
  // Shoplus keywords
  {kw:"shoplus alternative",          comp:"Shoplus",   vol:"680",   difficulty:"Low",    intent:"Money"},
  {kw:"tiktok shop winning products", comp:"Shoplus",   vol:"5,400", difficulty:"Medium", intent:"Money"},
  {kw:"tiktok shop best sellers",     comp:"Shoplus",   vol:"8,200", difficulty:"Medium", intent:"Info"},
  // Exlasso keywords
  {kw:"exlasso alternative",          comp:"Exlasso",   vol:"420",   difficulty:"Low",    intent:"Money"},
  {kw:"tiktok shop product finder",   comp:"Exlasso",   vol:"3,100", difficulty:"Low",    intent:"Money"},
  // TikTok Creative Center
  {kw:"tiktok creative center alternative", comp:"TikTok CC", vol:"2,300", difficulty:"Low", intent:"Money"},
  {kw:"better than tiktok creative center", comp:"TikTok CC", vol:"1,100", difficulty:"Low", intent:"Money"},
];

// ── USER SEARCH QUERIES ─────────────────────────────────────────
const USER_QUERIES = [
  {kw:"how to find viral products on tiktok shop",    vol:"18,000", difficulty:"Medium", intent:"Info"},
  {kw:"how to find winning products for tiktok shop", vol:"12,000", difficulty:"Medium", intent:"Info"},
  {kw:"best tiktok shop product research tool",       vol:"4,200",  difficulty:"Low",    intent:"Money"},
  {kw:"tiktok shop product research tool free",       vol:"2,800",  difficulty:"Low",    intent:"Money"},
  {kw:"how to find trending products tiktok 2026",    vol:"22,000", difficulty:"Medium", intent:"Info"},
  {kw:"tiktok shop trending products finder",         vol:"6,500",  difficulty:"Low",    intent:"Money"},
  {kw:"how to research tiktok shop products",         vol:"9,800",  difficulty:"Medium", intent:"Info"},
  {kw:"find viral tiktok products before they trend", vol:"7,200",  difficulty:"Low",    intent:"Info"},
  {kw:"tiktok shop product sourcing tool",            vol:"3,400",  difficulty:"Low",    intent:"Money"},
  {kw:"tiktok shop dropshipping product research",    vol:"5,100",  difficulty:"Low",    intent:"Money"},
];

// ── ORIGINAL TARGET KEYWORDS ────────────────────────────────────
const TARGET_KEYWORDS = [
  {kw:"TikTok Shop product research tool",     vol:"1,200", difficulty:"Low",    intent:"Money"},
  {kw:"best products to sell on TikTok Shop",  vol:"8,000", difficulty:"Medium", intent:"Money"},
  {kw:"TikTok Shop winning products",          vol:"3,500", difficulty:"Low",    intent:"Money"},
  {kw:"how to sell on TikTok Shop 2026",       vol:"22,000",difficulty:"Medium", intent:"Info"},
  {kw:"TikTok Shop for beginners",             vol:"18,000",difficulty:"Medium", intent:"Info"},
  {kw:"TikTok Shop dropshipping products",     vol:"2,800", difficulty:"Low",    intent:"Money"},
  {kw:"TikTok Shop profit margin calculator",  vol:"2,100", difficulty:"Very Low",intent:"Tool"},
  {kw:"trending TikTok Shop products 2026",    vol:"5,400", difficulty:"Low",    intent:"Info"},
];

// ── VIRAL PRODUCTS (from tikprofitpro.shop) ─────────────────────
const VIRAL_PRODUCTS = [
  {name:"LED Strip Lights",          score:94, category:"Home Decor",    url:`https://${DOMAIN}/?product=led-strip-lights`},
  {name:"Portable Blender",          score:91, category:"Kitchen",       url:`https://${DOMAIN}/?product=portable-blender`},
  {name:"Posture Corrector",         score:89, category:"Health",        url:`https://${DOMAIN}/?product=posture-corrector`},
  {name:"Car Phone Holder",          score:87, category:"Automotive",    url:`https://${DOMAIN}/?product=car-phone-holder`},
  {name:"Resistance Bands Set",      score:85, category:"Fitness",       url:`https://${DOMAIN}/?product=resistance-bands`},
  {name:"Magnetic Phone Case",       score:83, category:"Accessories",   url:`https://${DOMAIN}/?product=magnetic-phone-case`},
  {name:"Air Purifier Mini",         score:88, category:"Home",          url:`https://${DOMAIN}/?product=air-purifier-mini`},
  {name:"Teeth Whitening Kit",       score:86, category:"Beauty",        url:`https://${DOMAIN}/?product=teeth-whitening`},
];

// ── PUBLISHED POSTS (for internal links - editable) ─────────────
const DEFAULT_POSTS = [
  {title:"Complete Guide to TikTok Shop Product Research 2026", url:`${BLOG_URL}/tiktok-shop-product-research-guide-2026/`},
  {title:"10 Best Products to Sell on TikTok Shop Right Now",   url:`${BLOG_URL}/best-products-tiktok-shop/`},
  {title:"TikTok Shop vs Amazon: Which Is More Profitable?",    url:`${BLOG_URL}/tiktok-shop-vs-amazon/`},
  {title:"How to Find Winning Products for TikTok Shop",        url:`${BLOG_URL}/find-winning-products-tiktok-shop/`},
  {title:"Top Trending TikTok Shop Products March 2026",        url:`${BLOG_URL}/trending-tiktok-shop-products-march-2026/`},
];

const TEMPLATES = [
  {type:"Pillar Guide",    icon:"📘"},
  {type:"Trending Report", icon:"🔥"},
  {type:"Comparison Post", icon:"⚖️"},
  {type:"Tutorial",        icon:"🎓"},
  {type:"Case Study",      icon:"📊"},
  {type:"Tool Page",       icon:"🛠️"},
];

const TABS = ["🤖 AI Writer","🎯 Competitor KWs","🔍 User Queries","📅 Scheduler","📤 Publisher","⚙️ Settings"];

const ic = i => i==="Money"?"#00ff88":i==="Info"?"#00cfff":i==="Tool"?"#ffb800":"#ff88cc";
const sc = s => s>=80?"#00ff88":s>=60?"#ffb800":"#ff4444";

function Panel({title,children,style={}}) {
  return (
    <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:16,...style}}>
      <div style={{fontSize:11,fontWeight:700,marginBottom:14,color:"#fff",letterSpacing:"1px",textTransform:"uppercase"}}>{title}</div>
      {children}
    </div>
  );
}

function Pill({status}) {
  const c = status==="published"?{bg:"rgba(0,255,136,0.15)",col:"#00ff88"}
           :status==="scheduled"?{bg:"rgba(0,207,255,0.15)",col:"#00cfff"}
           :                     {bg:"rgba(255,184,0,0.15)", col:"#ffb800"};
  return <span style={{fontSize:10,padding:"3px 10px",borderRadius:20,fontWeight:700,background:c.bg,color:c.col}}>{status}</span>;
}

function Badge({label,color="#00ff88"}) {
  return <span style={{fontSize:9,padding:"2px 7px",borderRadius:20,fontWeight:700,background:`${color}18`,color,border:`1px solid ${color}30`,marginLeft:6}}>{label}</span>;
}

function App() {
  const [tab,        setTab]        = useState(0);
  const [kwSource,   setKwSource]   = useState("target"); // target | competitor | userquery | gsc
  const [selKw,      setSelKw]      = useState(TARGET_KEYWORDS[0]);
  const [selTpl,     setSelTpl]     = useState(TEMPLATES[0]);
  const [customKw,   setCustomKw]   = useState("");
  const [gscKw,      setGscKw]      = useState("");
  const [generating, setGenerating] = useState(false);
  const [streamText, setStreamText] = useState("");
  const [post,       setPost]       = useState(null);
  const [wordCount,  setWordCount]  = useState(0);
  const [score,      setScore]      = useState(null);
  const [pubStatus,  setPubStatus]  = useState(null);
  const [pubUrl,     setPubUrl]     = useState(null);
  const [pubErr,     setPubErr]     = useState(null);
  const [agentMsg,   setAgentMsg]   = useState(null);
  const [error,      setError]      = useState(null);
  const [publishedPosts, setPublishedPosts] = useState(DEFAULT_POSTS);
  const [newPostTitle,   setNewPostTitle]   = useState("");
  const [newPostUrl,     setNewPostUrl]     = useState("");
  const [selProducts,    setSelProducts]    = useState([VIRAL_PRODUCTS[0], VIRAL_PRODUCTS[1]]);
  const [usaCount,       setUsaCount]       = useState(3);
  const [scheduled,      setScheduled]      = useState([
    {title:"Complete Guide to TikTok Shop Product Research 2026", date:"Mar 13", status:"published", keyword:"TikTok Shop product research"},
    {title:"10 Best Products to Sell on TikTok Shop Right Now",   date:"Mar 15", status:"scheduled", keyword:"best products TikTok Shop"},
    {title:"TikTok Shop vs Amazon: Which Is More Profitable?",    date:"Mar 18", status:"draft",     keyword:"TikTok Shop vs Amazon"},
  ]);

  const activeKw = customKw.trim() || gscKw.trim() || selKw?.kw || "";

  // ── Build the mega prompt ──────────────────────────────────────
  const buildPrompt = (kw) => {
    const internalLinksSection = publishedPosts.slice(0,4).map(p =>
      `- [${p.title}](${p.url})`
    ).join("\n");

    const product1 = selProducts[0];
    const product2 = selProducts[1];

    return `You are an expert SEO content writer for ${BRAND} — a TikTok Shop product research SaaS at ${DOMAIN} targeting USA TikTok Shop sellers.

Write a complete SEO-optimized blog post for the keyword: "${kw}"
Post type: ${selTpl.type}

CRITICAL REQUIREMENTS — MUST FOLLOW ALL:

1. WORD COUNT: The post MUST be between 1000-1200 words. Count carefully. Not less than 1000, not more than 1200.

2. USA LOCAL SIGNALS: Naturally mention "USA" exactly 3 times throughout the post:
   - Once in the introduction paragraph
   - Once in a subheading or body section  
   - Once in the conclusion
   This gives Google local signals that this content targets USA TikTok Shop sellers.

3. VIRAL PRODUCT LINKS: Naturally and contextually embed these 2 products into the post body where relevant:
   - Product 1: "${product1.name}" (Virality: ${product1.score}) → link: ${product1.url}
   - Product 2: "${product2.name}" (Virality: ${product2.score}) → link: ${product2.url}
   Insert them as natural markdown links in a contextual sentence. Example: "Products like [${product1.name}](${product1.url}) are currently trending with a virality score of ${product1.score}."
   DO NOT make it sound promotional. Make it data-driven and natural.

4. INTERNAL LINKS: At the very end of the post, add a "Read More Guides" section with these internal links:
${internalLinksSection}
Format it exactly like this:
---
## 📚 Read More Guides
Explore more resources to grow your TikTok Shop business:
[list the links as markdown bullet points]
---

5. CTA TO TIKPROFITPRO: Naturally mention ${BRAND} at ${DOMAIN} at least twice — once mid-post and once in conclusion. Frame it as the tool USA sellers use to find trending products.

Return EXACTLY this format:

---TITLE---
[SEO title under 60 chars with keyword]

---META---
[Meta description 150-160 chars with keyword, USA mention, and CTA]

---SLUG---
[URL slug: lowercase hyphens only]

---CONTENT---
[Full markdown post following ALL 5 requirements above]

---WORD_COUNT---
[exact word count as a number]

---SEO_SCORE---
[XX/100 — one line reason]`;
  };

  // ── Generate ───────────────────────────────────────────────────
  const generate = async () => {
    const kw = activeKw;
    if (!kw) { setError("Please select or enter a keyword first."); return; }

    setGenerating(true);
    setStreamText("");
    setPost(null);
    setScore(null);
    setWordCount(0);
    setPubStatus(null);
    setPubUrl(null);
    setPubErr(null);
    setError(null);
    setAgentMsg("⚙️ Building optimized prompt with all 6 SEO rules...");

    await new Promise(r => setTimeout(r, 600));
    setAgentMsg("🤖 Sending to GPT-4o via api.tikprofitpro.shop...");

    try {
      const res = await fetch(GENERATE_URL, {
        method:  "POST",
        headers: {"Content-Type":"application/json"},
        body:    JSON.stringify({prompt: buildPrompt(kw)}),
      });

      if (!res.ok) throw new Error(`Server error ${res.status}: ${await res.text()}`);

      const data = await res.json();

      let full = "";
      if (data?.choices?.[0]?.message?.content) {
        full = data.choices[0].message.content;
      } else if (data?.content?.[0]?.text) {
        full = data.content.map(c => c.text||"").join("");
      } else if (data?.error) {
        throw new Error(data.error.message || JSON.stringify(data.error));
      } else {
        throw new Error("Unexpected response: " + JSON.stringify(data).slice(0,200));
      }

      if (!full.trim()) throw new Error("Empty response from AI.");

      setAgentMsg("✍️ Streaming post with all SEO enhancements...");

      let i = 0;
      const iv = setInterval(() => {
        i += 30;
        setStreamText(full.slice(0, i));
        if (i >= full.length) {
          clearInterval(iv);
          parsePost(full, kw);
          setGenerating(false);
          setAgentMsg(null);
        }
      }, 6);

    } catch(e) {
      setError(e.message);
      setGenerating(false);
      setAgentMsg(null);
    }
  };

  const parsePost = (text, kw) => {
    const ext = tag => {
      const m = text.match(new RegExp(`---${tag}---\\n([\\s\\S]*?)(?=\\n---[A-Z_]+---|$)`));
      return m ? m[1].trim() : "";
    };
    const content    = ext("CONTENT");
    const scoreRaw   = ext("SEO_SCORE");
    const wcRaw      = ext("WORD_COUNT");
    const scoreNum   = parseInt((scoreRaw.match(/(\d+)/)||["","78"])[1]);
    const wc         = parseInt(wcRaw) || content.split(/\s+/).filter(Boolean).length;

    // Verify USA mentions
    const usaMentions = (content.match(/\bUSA\b/g)||[]).length;
    // Verify internal links
    const hasReadMore = content.includes("Read More Guides");
    // Verify viral products
    const hasProduct1 = content.includes(selProducts[0].name);
    const hasProduct2 = content.includes(selProducts[1].name);

    const parsed = {
      title:   ext("TITLE") || kw,
      meta:    ext("META"),
      slug:    ext("SLUG")  || kw.toLowerCase().replace(/[^a-z0-9]+/g,"-"),
      content,
      seoRaw:  scoreRaw,
      checks: {
        wordCount:    wc,
        usaMentions,
        hasReadMore,
        hasProduct1,
        hasProduct2,
        wordCountOk:  wc >= 1000 && wc <= 1200,
      },
    };
    setPost(parsed);
    setScore(scoreNum);
    setWordCount(wc);
    setScheduled(prev => [{title:parsed.title, date:"Pending", status:"draft", keyword:kw}, ...prev]);
  };

  // ── Publish ────────────────────────────────────────────────────
  const publish = async () => {
    if (!post) return;
    setPubStatus("publishing");
    setPubErr(null);
    setAgentMsg("📡 Publishing to blog.tikprofitpro.shop...");
    try {
      const res  = await fetch(PUBLISH_URL, {
        method:  "POST",
        headers: {"Content-Type":"application/json"},
        body:    JSON.stringify({
          title:   post.title,
          slug:    post.slug,
          meta:    post.meta,
          content: post.content,
        }),
      });
      const data = await res.json();
      if (data?.errors?.length) throw new Error(data.errors[0].message);
      const slug = data?.posts?.[0]?.slug || post.slug;
      const url  = `${BLOG_URL}/${slug}/`;
      setPubStatus("published");
      setPubUrl(url);
      setAgentMsg("✅ Live on Ghost!");
      // Add to published posts list for future internal links
      setPublishedPosts(prev => [{title:post.title, url}, ...prev].slice(0,8));
      setScheduled(prev => prev.map(p => p.title===post.title ? {...p,status:"published",date:"Today"} : p));
      setTimeout(() => setAgentMsg(null), 3000);
    } catch(e) {
      setPubStatus("error");
      setPubErr(e.message);
      setAgentMsg(null);
    }
  };

  const pubCount   = scheduled.filter(p=>p.status==="published").length;
  const schedCount = scheduled.filter(p=>p.status==="scheduled").length;

  const allKwLists = {
    target:     TARGET_KEYWORDS,
    competitor: COMPETITOR_KEYWORDS,
    userquery:  USER_QUERIES,
  };

  return (
    <div style={{position:"relative",zIndex:1,maxWidth:1160,margin:"0 auto",padding:"20px 14px"}}>

      {/* ── HEADER ── */}
      <div style={{marginBottom:20,borderBottom:"1px solid rgba(0,255,136,0.12)",paddingBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:38,height:38,borderRadius:9,background:"linear-gradient(135deg,#00ff88,#00cfff)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,fontWeight:900,color:"#060a10",flexShrink:0}}>⚡</div>
          <div style={{flex:1}}>
            <div style={{fontSize:18,fontWeight:800,color:"#fff",letterSpacing:"-0.5px"}}>
              TikProfitPro <span style={{color:"#00ff88"}}>SEO Autopilot</span>
              <span style={{fontSize:10,marginLeft:8,padding:"2px 8px",borderRadius:20,background:"rgba(0,255,136,0.15)",color:"#00ff88",fontWeight:700,verticalAlign:"middle"}}>v2.0</span>
            </div>
            <div style={{fontSize:10,color:"#3a5268",letterSpacing:"2px",textTransform:"uppercase",marginTop:2}}>
              Competitor Research → GSC Keywords → GPT-4o → Ghost Publisher
            </div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <span style={{width:7,height:7,borderRadius:"50%",background:"#00ff88",display:"inline-block"}} className="pulse"/>
            <span style={{fontSize:11,color:"#00ff88",fontWeight:700}}>ALL SYSTEMS LIVE</span>
          </div>
        </div>
        {agentMsg && (
          <div style={{marginTop:10,padding:"8px 14px",background:"rgba(0,255,136,0.06)",border:"1px solid rgba(0,255,136,0.2)",borderRadius:6,fontSize:11,color:"#00ff88",display:"flex",alignItems:"center",gap:8}}>
            <span className="pulse">●</span> {agentMsg}
          </div>
        )}
      </div>

      {/* ── STATS BAR ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:18}}>
        {[
          {label:"Published",    value:pubCount+1,         color:"#00ff88"},
          {label:"Scheduled",    value:schedCount,         color:"#00cfff"},
          {label:"Competitor KWs",value:COMPETITOR_KEYWORDS.length, color:"#ffb800"},
          {label:"User Queries", value:USER_QUERIES.length,color:"#ff88cc"},
          {label:"Word Target",  value:"1000-1200",        color:"#00ff88"},
        ].map((s,i) => (
          <div key={i} style={{background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:9,padding:"12px 14px"}}>
            <div style={{fontSize:18,fontWeight:800,color:s.color,letterSpacing:"-0.5px"}}>{s.value}</div>
            <div style={{fontSize:10,color:"#3a5268",marginTop:1,textTransform:"uppercase",letterSpacing:"0.5px"}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* ── TABS ── */}
      <div style={{display:"flex",gap:3,marginBottom:16,flexWrap:"wrap"}}>
        {TABS.map((t,i) => (
          <button key={i} onClick={()=>setTab(i)} style={{
            padding:"7px 14px",borderRadius:6,border:"none",cursor:"pointer",
            fontSize:11,fontFamily:"inherit",fontWeight:700,letterSpacing:"0.3px",
            background:tab===i?"linear-gradient(135deg,#00ff88,#00cfff)":"rgba(255,255,255,0.04)",
            color:tab===i?"#060a10":"#5a7a8a",transition:"all 0.15s",
          }}>{t}</button>
        ))}
      </div>

      {/* ══════════════════════════════════════════
          TAB 0: AI WRITER
      ══════════════════════════════════════════ */}
      {tab===0 && (
        <div style={{display:"grid",gridTemplateColumns:"300px 1fr",gap:14}}>

          {/* LEFT PANEL */}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>

            {/* Keyword Source Selector */}
            <Panel title="📡 Keyword Source">
              {[
                {id:"target",    label:"🎯 Target Keywords",    count:TARGET_KEYWORDS.length},
                {id:"competitor",label:"🕵️ Competitor Research", count:COMPETITOR_KEYWORDS.length},
                {id:"userquery", label:"🔍 User Search Queries", count:USER_QUERIES.length},
                {id:"gsc",       label:"📊 GSC / Custom",        count:"manual"},
              ].map(s => (
                <div key={s.id} onClick={()=>{setKwSource(s.id);setCustomKw("");setGscKw("");}}
                  style={{padding:"8px 10px",borderRadius:6,cursor:"pointer",marginBottom:3,
                    background:kwSource===s.id?"rgba(0,255,136,0.08)":"transparent",
                    border:kwSource===s.id?"1px solid rgba(0,255,136,0.25)":"1px solid transparent",
                    display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12}}>
                  <span style={{color:kwSource===s.id?"#e0e8f0":"#5a7a8a"}}>{s.label}</span>
                  <span style={{fontSize:10,color:"#3a5268",background:"rgba(255,255,255,0.05)",padding:"1px 7px",borderRadius:10}}>{s.count}</span>
                </div>
              ))}
            </Panel>

            {/* GSC / Custom keyword input */}
            {kwSource==="gsc" && (
              <Panel title="📊 GSC / Custom Keyword">
                <div style={{fontSize:10,color:"#3a5268",marginBottom:8,lineHeight:1.6}}>
                  Paste a keyword from Google Search Console or type any custom keyword:

      {tab===5 && (
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>

          {/* Published Posts Manager */}
          <Panel title="📚 Published Posts (Internal Links Pool)">
            <div style={{fontSize:10,color:"#3a5268",marginBottom:10,lineHeight:1.6}}>
              These posts are automatically added as internal links in every new post you publish. Add new posts here after publishing.
            </div>
            <div style={{maxHeight:220,overflowY:"auto",marginBottom:10}}>
              {publishedPosts.map((p,i)=>(
                <div key={i} style={{padding:"7px 9px",borderRadius:5,marginBottom:4,
                  background:"rgba(0,255,136,0.04)",border:"1px solid rgba(0,255,136,0.1)",
                  display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:11,color:"#c0d0e0",marginBottom:1}}>{p.title}</div>
                    <div style={{fontSize:9,color:"#3a5268"}}>{p.url}</div>
                  </div>
                  <button onClick={()=>setPublishedPosts(prev=>prev.filter((_,j)=>j!==i))}
                    style={{background:"none",border:"none",color:"#ff4444",cursor:"pointer",fontSize:14,flexShrink:0}}>×</button>
                </div>
              ))}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <input value={newPostTitle} onChange={e=>setNewPostTitle(e.target.value)}
                placeholder="Post title..."
                style={{padding:"7px 10px",borderRadius:5,background:"rgba(0,0,0,0.4)",
                  border:"1px solid rgba(255,255,255,0.08)",color:"#e0e8f0",fontSize:11}}/>
              <input value={newPostUrl} onChange={e=>setNewPostUrl(e.target.value)}
                placeholder="Full URL (https://blog.tikprofitpro.shop/slug/)"
                style={{padding:"7px 10px",borderRadius:5,background:"rgba(0,0,0,0.4)",
                  border:"1px solid rgba(255,255,255,0.08)",color:"#e0e8f0",fontSize:11}}/>
              <button onClick={()=>{
                if(newPostTitle&&newPostUrl){
                  setPublishedPosts(prev=>[{title:newPostTitle,url:newPostUrl},...prev]);
                  setNewPostTitle(""); setNewPostUrl("");
                }
              }} style={{padding:"8px",borderRadius:6,border:"none",
                background:"rgba(0,255,136,0.12)",color:"#00ff88",
                cursor:"pointer",fontSize:11,fontFamily:"inherit",fontWeight:700}}>
                + Add Post to Pool
              </button>
            </div>
          </Panel>

          {/* GSC Instructions */}
          <Panel title="📊 Google Search Console Setup">
            <div style={{fontSize:11,color:"#5a7a8a",lineHeight:1.8}}>
              <div style={{marginBottom:12}}>
                <strong style={{color:"#00cfff"}}>How to get keywords from GSC:</strong>
              </div>
              {[
                "1. Go to search.google.com/search-console",
                "2. Select tikprofitpro.shop property",
                "3. Click Performance → Search Results",
                "4. Sort by Impressions (descending)",
                "5. Look for queries with high impressions but low clicks",
                "6. Copy those keywords",
                "7. Come to SEO Autopilot → AI Writer",
                "8. Select 'GSC / Custom' as keyword source",
                "9. Paste the keyword → Generate → Publish",
              ].map((s,i)=>(
                <div key={i} style={{padding:"4px 0",borderBottom:"1px solid rgba(255,255,255,0.04)",fontSize:10,color:i===0?"#00cfff":"#5a7a8a"}}>{s}</div>
              ))}
              <div style={{marginTop:12,padding:10,borderRadius:6,
                background:"rgba(0,255,136,0.06)",border:"1px solid rgba(0,255,136,0.15)",fontSize:10,color:"#00ff88"}}>
                💡 High impressions + low clicks = Google shows your page but people don't click. Writing a better post on that keyword = instant traffic boost.
              </div>
            </div>
          </Panel>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
